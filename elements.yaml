# sample-azure — model elements
#
# Standalone ArchiMate model for this directory (FRICTIONLESS_MODEL_DIR points
# here — see platform/packages/modelling-specification's README and
# architecture/model/README.md for the schema).
#
# Schema:  type / id / name / desc? / props?
#   type   bare ArchiMate 3.2 concept name (pyArchimate.ArchiType), case-insensitive
#   id     stable kebab id -> deterministic UUID (never renumber a live id)
#   props  str->str

# =====================================================================
# Technology — infrastructure provisioned by main.bicep
# =====================================================================
- type: Node
  id: node-static-web-app
  name: Static Web App
  desc: >-
    Azure Static Web App (Free tier) hosting the public/ frontend and its
    integrated Functions API (api/).
  props:
    sku: Free

- type: Node
  id: node-sql-server
  name: Azure SQL Server
  desc: >-
    Azure SQL Server (Microsoft.Sql/servers) — logical server hosting the
    appdb database and the Database Engine that executes its queries.

- type: Artifact
  id: artifact-sql-appdb
  name: appdb
  desc: >-
    Free-tier serverless Azure SQL database (GP_S_Gen5). Holds dbo.DemoItems,
    created and seeded by the API on first request.
  props:
    sku: "GP_S_Gen5 (free limit, auto-pause)"

- type: Artifact
  id: artifact-static-site-appsettings
  name: Database Config
  desc: >-
    Microsoft.Web/staticSites/config "appsettings" (main.bicep
    staticSiteAppSettings) — SQL_SERVER, SQL_DATABASE, SQL_USER, SQL_PASSWORD
    read by the Items API at runtime.

- type: CommunicationNetwork
  id: comm-no-vnet-azure-network
  name: No-VNet Azure Network
  desc: >-
    Neither side has VNet integration or Private Link, so the Static Web
    App's egress to SQL (no VNet option on Free tier) and the SQL Server's
    public endpoint (publicNetworkAccess: Enabled) share this unisolated
    network plane. Not the open internet: access is additionally gated by
    the AllowAzureServices firewall rule, which admits any Azure tenant's
    services, not arbitrary internet hosts. (The specific access-control
    values live as props on SQL Server Interface below — they're that
    interface's gating policy, not an intrinsic property of this network.)

- type: CommunicationNetwork
  id: comm-internet
  name: Internet
  desc: >-
    The genuinely open internet: unlike the no-VNet Azure network above,
    there's no firewall rule or Azure-tenant scoping here — any browser,
    anywhere, can reach the Static Web App's public HTTPS endpoint (Free
    tier has no private-endpoint option). This is the Visitor's ingress
    path, and the Static Web App's only direct egress/ingress boundary to
    the public internet as opposed to Azure's own network.

# =====================================================================
# Application — the Functions API and the data it reads/writes
# =====================================================================
- type: ApplicationComponent
  id: app-items-api
  name: Items API
  desc: >-
    TypeScript Azure Functions API (api/src/functions/items.ts). The page
    calls /api/items; on first request it creates dbo.DemoItems and inserts
    three sample rows if the table is empty.

- type: ApplicationComponent
  id: app-frontend
  name: Frontend
  desc: >-
    Static browser app (public/index.html, public/app.js). Calls GET /api/items
    on page load and renders the returned DemoItem rows.

- type: ApplicationInterface
  id: int-items-api
  name: "/api/items Interface"
  desc: HTTP interface exposed by the Items API component for the frontend to call.

- type: ApplicationProcess
  id: app-init-demo-data
  name: Initialize Demo Data
  desc: >-
    First-request setup inside getItems(): sp_getapplock, CREATE TABLE
    dbo.DemoItems if missing, INSERT 3 seed rows if empty.

- type: ApplicationProcess
  id: app-read-demo-items
  name: Read Demo Items
  desc: "SELECT Id, Name, Category FROM dbo.DemoItems ORDER BY Id, run every request after initialization."

- type: DataObject
  id: do-demo-items
  name: DemoItems
  desc: dbo.DemoItems table — created and seeded by the Items API on first request.

# --- Conversational authoring: applied via POST /authoring/.../decide (GH #108) ---
- type: TechnologyInterface
  id: int-sql-server
  name: SQL Server Interface
  desc: >-
    Interface exposed by Azure SQL Server for external communication —
    speaks TDS (Tabular Data Stream), the wire protocol Microsoft SQL
    Server and its client drivers (sys-mssql-driver) use to exchange
    queries and results.
  props:
    public-network-access: Enabled
    firewall-rule: "AllowAzureServices (0.0.0.0-0.0.0.0)"
    min-tls-version: "1.2"

- {type: TechnologyInterface, id: int-web-app, name: Web App Interface, desc: Interface exposed by the Static Web App for external communication.}

# --- Conversational authoring: applied via POST /authoring/.../decide (GH #108) ---
- type: SystemSoftware
  id: sys-azure-sql-server
  name: SQL Server Database Engine
  desc: >-
    Database engine behind Azure SQL Server (Microsoft.Sql/servers) —
    executes the queries app-init-demo-data/app-read-demo-items send
    through the SQL Server Interface.

- type: SystemSoftware
  id: sys-azure-static-site
  name: Static Web App Hosting Service
  desc: >-
    Azure Static Web App's own hosting service (Microsoft.Web/staticSites)
    — serves the Frontend's static files to the browser, and manages the
    Functions host's app settings (Database Config).

- type: SystemSoftware
  id: sys-nodejs-runtime
  name: Node.js 24 Runtime
  desc: >-
    Server-side JS runtime hosting the compiled Items API (api/package.json
    engines.node >=24; see uml/structure/6-deployment.puml). Does not run
    the Frontend, which executes in the Visitor's browser, not this runtime.

- type: SystemSoftware
  id: sys-mssql-driver
  name: "mssql Driver (v11)"
  desc: >-
    npm `mssql` package (api/package.json direct dependency) — the TDS
    client library getPool()/getItems() use to reach Azure SQL (see
    uml/structure/3-component.puml's "TDS (mssql)" interface).

- type: SystemSoftware
  id: sys-azure-functions-worker
  name: "Azure Functions Worker (v4)"
  desc: >-
    npm `@azure/functions` package (api/package.json direct dependency,
    v4 programming model per host.json "version": "2.0") — provides the
    app.http() binding that routes incoming /api/items requests to the
    Items API handler (api/src/functions/items.ts).

# =====================================================================
# Business — the people-facing use of the demo app
# =====================================================================
- type: BusinessActor
  id: biz-visitor
  name: Visitor
  desc: End user browsing the deployed Static Web App (8-use-case.puml).

- type: BusinessProcess
  id: biz-view-demo-items
  name: View Demo Items
  desc: >-
    The Visitor loads the page and sees the demo item list (8-use-case.puml
    UC1, includes UC2 "Initialize demo data").

- type: BusinessInterface
  id: biz-website
  name: Website
  desc: The public URL/browser channel through which the Visitor reaches the app.

- {type: ApplicationInterface, id: int-frontend, name: Frontend Interface, desc: HTTP interface exposed by the Frontend component for the Visitor to interact with.}
