# sample-azure — model relationships
#
# Schema:  type / source / target / label? / props?
#   type    ArchiMate 3.2 relationship name, case-insensitive
#   source  element id      target  element id

- type: Assignment
  source: node-sql-server
  target: artifact-sql-appdb
  label: hosts

- type: Realization
  source: artifact-sql-appdb
  target: do-demo-items

- {type: Assignment, source: node-static-web-app, target: artifact-static-site-appsettings, label: hosts}

- {type: Association, source: artifact-static-site-appsettings, target: app-items-api, label: "SQL_SERVER / SQL_DATABASE / SQL_USER / SQL_PASSWORD app settings"}

# --- Technology: no VNet/private endpoint on either side (main.bicep) ---
# (Static Web App side attaches at sys-mssql-driver below, once that element exists —
# matching int-sql-server's interface-level grain on the other side, not the Node's.)

# --- Conversational authoring: applied via POST /authoring/.../decide (GH #108) ---

# --- Conversational authoring: applied via POST /authoring/.../decide (GH #108) ---
- {type: Assignment, source: node-sql-server, target: int-sql-server}
- {type: Assignment, source: node-static-web-app, target: int-web-app}

# --- Conversational authoring: applied via POST /authoring/.../decide (GH #108) ---

# --- Conversational authoring: applied via POST /authoring/.../decide (GH #108) ---
- {type: Assignment, source: node-sql-server, target: sys-azure-sql-server}
- {type: Assignment, source: node-static-web-app, target: sys-azure-static-site}
- {type: Serving, source: sys-azure-sql-server, target: app-items-api, label: "executes queries"}
- {type: Serving, source: sys-azure-static-site, target: app-frontend, label: "serves static files"}

# --- Application: frontend, API process split (uml/structure, uml/behavior) ---
- {type: Realization, source: node-static-web-app, target: app-frontend, label: hosts}
- {type: Realization, source: node-static-web-app, target: app-items-api, label: hosts}
- {type: Composition, source: app-items-api, target: int-items-api, label: exposes}
- {type: Serving, source: int-items-api, target: app-frontend, label: "GET /api/items"}

- {type: Assignment, source: app-items-api, target: app-init-demo-data}
- {type: Assignment, source: app-items-api, target: app-read-demo-items}
- {type: Triggering, source: app-init-demo-data, target: app-read-demo-items}

- type: Access
  source: app-init-demo-data
  target: do-demo-items
  label: create/seed
  props:
    access_type: Write

- type: Access
  source: app-read-demo-items
  target: do-demo-items
  label: select
  props:
    access_type: Read

# --- Business: Visitor viewing the demo items (uml/behavior/8-use-case.puml) ---
- {type: Assignment, source: biz-visitor, target: biz-view-demo-items}
- {type: Serving, source: biz-website, target: biz-visitor, label: "provides access for"}
- {type: Realization, source: app-frontend, target: biz-website}
- {type: Realization, source: app-read-demo-items, target: biz-view-demo-items}
- {type: Composition, source: app-frontend, target: int-frontend, label: exposes}
- {type: Serving, source: int-frontend, target: biz-website, label: provides access for}

# --- Conversational authoring: applied via POST /authoring/.../decide (GH #108) ---
- {type: Association, source: comm-internet, target: int-web-app}
- {type: Association, source: comm-no-vnet-azure-network, target: int-sql-server}

# --- Conversational authoring: applied via POST /authoring/.../decide (GH #108) ---
- type: Access
  source: sys-azure-static-site
  target: artifact-static-site-appsettings
  label: "provisions app settings"
  props:
    access_type: Write

# --- Technology: runtime stack behind the Items API only, not the Frontend (api/package.json) ---
- {type: Assignment, source: node-static-web-app, target: sys-nodejs-runtime, label: hosts}
- {type: Serving, source: sys-nodejs-runtime, target: app-items-api, label: executes}
- {type: Assignment, source: node-static-web-app, target: sys-mssql-driver, label: hosts}
- {type: Serving, source: sys-mssql-driver, target: app-items-api, label: "provides SQL connectivity"}
- {type: Association, source: sys-mssql-driver, target: comm-no-vnet-azure-network}

- type: Access
  source: sys-mssql-driver
  target: artifact-static-site-appsettings
  label: "reads SQL_SERVER / SQL_DATABASE / SQL_USER / SQL_PASSWORD"
  props:
    access_type: Read
