<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:900px;height:598px;background:#FFFFFF;" width="900px" height="598px" viewBox="0 0 900 598" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="271.522" y="24.533" fill="#000" font-size="14" textLength="350.854" font-weight="700">State machine: Azure SQL free-tier database (appdb)</text></g><g class="entity" data-qualified-name="Active" id="ent0001" data-source-line="5"><rect x="296.5" y="125.609" width="243.303" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="296.5" y1="153.219" x2="539.803" y2="153.219" style="stroke:#181818;stroke-width:0.5;"/><text x="399.089" y="145.143" fill="#000" font-size="14" textLength="38.124">Active</text><text x="301.5" y="172.752" fill="#000" font-size="14" textLength="223.303">dbo.DemoItems serves reads/writes</text></g><g class="entity" data-qualified-name="AutoPaused" id="ent0002" data-source-line="9"><rect x="7" y="292.109" width="216.116" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="319.719" x2="223.116" y2="319.719" style="stroke:#181818;stroke-width:0.5;"/><text x="76.917" y="311.643" fill="#000" font-size="14" textLength="76.282">AutoPaused</text><text x="12" y="339.252" fill="#000" font-size="14" textLength="196.116">compute released; storage kept</text></g><g class="entity" data-qualified-name="Resuming" id="ent0003" data-source-line="12"><rect x="311" y="458.609" width="313.973" height="125.656" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="311" y1="486.219" x2="624.973" y2="486.219" style="stroke:#181818;stroke-width:0.5;"/><text x="436.473" y="478.143" fill="#000" font-size="14" textLength="63.027">Resuming</text><text x="316" y="505.752" fill="#000" font-size="14" textLength="127.647">up to about a minute</text><text x="316" y="523.361" fill="#000" font-size="14" textLength="274.271">GET /api/items returns 503 + Retry-After: 10</text><text x="316" y="540.971" fill="#000" font-size="14" textLength="293.973">{error: "The database is waking up. Retrying...",</text><text x="319.89" y="558.58" fill="#000" font-size="14" textLength="91.048">retryable: true}</text><text x="316" y="576.189" fill="#000" font-size="14" textLength="285.599">the page retries every 10 s for up to 2 minutes</text></g><g class="entity" data-qualified-name="Paused" id="ent0004" data-source-line="15"><rect x="321.5" y="274.609" width="227.307" height="90.438" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="321.5" y1="302.219" x2="548.807" y2="302.219" style="stroke:#181818;stroke-width:0.5;"/><text x="411.412" y="294.143" fill="#000" font-size="14" textLength="47.482">Paused</text><text x="326.5" y="321.752" fill="#000" font-size="14" textLength="121.365">GET /api/items fails</text><text x="326.5" y="339.361" fill="#000" font-size="14" textLength="207.307">(500 "Unable to load demo items.</text><text x="326.5" y="356.971" fill="#000" font-size="14" textLength="197.169">Check the API logs for details.")</text></g><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="3"><ellipse cx="418" cy="54.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start* to Active--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-source-line="3" data-link-type="dependency"><path d="M418,64.859 C418,78.639 418,100.079 418,120.259" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Active"/><polygon points="418,125.259,422,116.259,418,120.259,414,116.259,418,125.259" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Active to AutoPaused--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="6" data-link-type="dependency"><path d="M296.34,158.029 C209.83,163.679 104.18,177.399 76,210.609 C56.14,234.019 71.303,264.34 88.913,287.98" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-AutoPaused"/><polygon points="91.9,291.989,89.731,282.382,88.913,287.98,83.316,287.161,91.9,291.989" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="77" y="225.104" fill="#000" font-size="13" textLength="181.384">60 minutes without connections</text><text x="99.414" y="241.456" fill="#000" font-size="13" textLength="136.557">(serverless auto-pause)</text></g><!--link Active to Paused--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk8" data-source-line="7" data-link-type="dependency"><path d="M315.14,180.759 C280.06,195.329 253.75,216.279 272,244.609 C283.95,263.159 297.402,274.749 316.972,285.229" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Paused"/><polygon points="321.38,287.589,315.334,279.814,316.972,285.229,311.558,286.867,321.38,287.589" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="318.89" y="225.104" fill="#000" font-size="13" textLength="153.182">free compute limit reached</text><text x="273" y="241.456" fill="#000" font-size="13" textLength="244.962">(freeLimitExhaustionBehavior: AutoPause)</text></g><!--link Paused to Active--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk11" data-source-line="16" data-link-type="dependency"><path d="M501.94,274.469 C521.89,255.669 535.29,232.959 522,210.609 C514.65,198.249 507.766,191.091 495.506,183.341" style="stroke:#181818;stroke-width:1;" fill="none" id="Paused-to-Active"/><polygon points="491.28,180.669,496.75,188.859,495.506,183.341,501.025,182.097,491.28,180.669" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="529" y="233.104" fill="#000" font-size="13" textLength="171.971">monthly free allowance resets</text></g><!--link AutoPaused to Resuming--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-source-line="10" data-link-type="dependency"><path d="M161.88,347.169 C211.76,375.429 288.09,418.675 354.1,456.075" style="stroke:#181818;stroke-width:1;" fill="none" id="AutoPaused-to-Resuming"/><polygon points="358.45,458.539,352.591,450.623,354.1,456.075,348.648,457.583,358.45,458.539" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="361.091" y="409.104" fill="#000" font-size="13" textLength="141.61">GET /api/items connects</text><text x="304" y="425.456" fill="#000" font-size="13" textLength="255.792">(the connection attempt triggers the resume)</text></g><!--link Resuming to Active--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk10" data-source-line="13" data-link-type="dependency"><path d="M573.09,458.319 C666.55,395.129 778.5,294.899 709,210.609 C687.19,184.149 614.211,170.468 544.481,162.918" style="stroke:#181818;stroke-width:1;" fill="none" id="Resuming-to-Active"/><polygon points="539.51,162.379,548.027,167.325,544.481,162.918,548.888,159.371,539.51,162.379" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="758.095" y="317.104" fill="#000" font-size="13" textLength="99.709">resume complete</text><text x="731" y="333.456" fill="#000" font-size="13" textLength="153.899">(the next retry returns 200)</text></g><?plantuml-src NLB1RjD04BtxAqOvDK0SKrGEGK8AKA5AFHGe9ynXRK_YLTQxrkmuQK3yUsVin34zMTwPz-QzDyEM7S8FDepGcBAs7bUm_jEHF7wxXmqXBjWYGMNO52OYN9cshOfvalnwzHiMYu-mBjdkCKc6BwoWAaBw1PjmnzX4Y4XxZ41eghWya6MCvzOUtN5uC5t4If3lCsYixwG53fRhq36KmNkKzk1ZxgzwCd8O8nW1Bbf5pgTy8vTA5tJJ2XqusrXM3MMDbV1eyLxVRfzg0IZz9wpDtWPQNII9oV_adTa87KeKrGU87CXi4NRO